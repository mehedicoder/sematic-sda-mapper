services:
  semantic-sda-mapper:
    image: semantic-sda-mapper:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: container
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: "no"

  nodered:
    image: nodered/node-red
    container_name: mynodered
    ports:
      - "1880:1880"
    stdin_open: true
    tty: true
    restart: "no"
