spring:
  application:
    name: semantic-sda-mapper
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/semantic_sda_mapper}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317/v1/traces

logging:
  level:
    root: INFO
    com.sda.mapper: DEBUG
    org.springframework.security: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
    dateformat: "yyyy-MM-dd HH:mm:ss.SSS"

# OPC UA Simulation Configuration
simulation:
  opcua:
    enabled: ${OPC_UA_ENABLED:true}
    port: ${OPC_UA_PORT:4840}
  tank:
    host: ${TANK_HOST:localhost}
    port: ${TANK_PORT:4334}
    path: ${TANK_PATH:/UA/FlowMeterServer}

# OPC UA Unified Client Configuration
opc-ua:
  client:
    read-timeout-ms: ${OPC_UA_READ_TIMEOUT_MS:5000}
    connect-timeout-ms: ${OPC_UA_CONNECT_TIMEOUT_MS:5000}

# Ontology Inference Configuration
vaadin:
  productionMode: true

app:
  ontology:
    file-paths:
      - ontology/sda_ontology_v2_structured.ttl
      - ontology/seed-services.ttl
      - ontology/seed-requirements.ttl
    inference:
      enabled: ${ONTOLOGY_INFERENCE_ENABLED:true}
  llm:
    # Optional LLM-based semantic translation (paper p.7-8, p.12).
    # Defaults to OpenRouter with a free model. Enable and supply an API key
    # via environment variable (never commit secrets).
    enabled: ${APP_LLM_ENABLED:false}
    provider: ${APP_LLM_PROVIDER:OPENROUTER}
    # api-key is supplied via APP_LLM_APIKEY (left blank by default)
    api-key: ${APP_LLM_APIKEY:}
    model: ${APP_LLM_MODEL:mistralai/mistral-7b-instruct:free}
    # base-url / timeout-ms / temperature / max-tokens are optional;
    # provider presets supply the default base URL.
