networks:
  sda-network:
    driver: bridge

services:
  semantic-sda-mapper:
    image: semantic-sda-mapper:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: container
      DATABASE_URL: jdbc:postgresql://postgres:5432/semantic_sda_mapper
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      OPC_UA_SERVER_HOST: nodered
      OPC_UA_SERVER_PORT: 4840
      FILE_STORAGE_PATH: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - file-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      nodered:
        condition: service_healthy
    networks:
      - sda-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: semantic_sda_mapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d semantic_sda_mapper"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"
    networks:
      - sda-network

  nodered:
    build:
      context: .
      dockerfile: docker/nodered/Dockerfile
    container_name: mynodered
    ports:
      - "1880:1880"
      - "4840:4840"
    volumes:
      - ./docs/nodered-flow-fermentation-hvac.json:/data/flows.json
    stdin_open: true
    tty: true
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1880/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - sda-network

  tank-simulation:
    build:
      context: docker/tank-simulation
      dockerfile: Dockerfile
    container_name: tank-simulation
    ports:
      - "4334:4334"
      - "3000:3000"
      - "8081:8081"
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/tank/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - sda-network

volumes:
  pgdata:
  file-uploads:
